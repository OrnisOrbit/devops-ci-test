name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run linter
      run: flake8 app.py

  build-and-push:
    # Эта джоба запустится ТОЛЬКО если джоба test завершилась успешно!
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # Здесь мы формируем имя образа: твой_логин/имя_репозитория:тег
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest
# ... (предыдущие джобы test и build-and-push остаются без изменений) ...

  deploy:
    # Эта джоба запустится ТОЛЬКО после успешной сборки и пуша образа
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Команды, которые выполнятся на сервере:
        script: |
          # 1. Скачиваем свежий образ из Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest
          
          # 2. Останавливаем и удаляем старый контейнер (если он есть)
          docker stop test-daemon || true
          docker rm test-daemon || true
          
          # 3. Запускаем новый контейнер
          docker run -d --name test-daemon ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest
# ... (предыдущие джобы test и build-and-push остаются без изменений) ...

  deploy:
    # Эта джоба запустится ТОЛЬКО после успешной сборки и пуша образа
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        # Команды, которые выполнятся на сервере:
        script: |
          # 1. Скачиваем свежий образ из Docker Hub
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest
          
          # 2. Останавливаем и удаляем старый контейнер (если он есть)
          docker stop test-daemon || true
          docker rm test-daemon || true
          
          # 3. Запускаем новый контейнер
          docker run -d --name test-daemon ${{ secrets.DOCKERHUB_USERNAME }}/my-first-app:latest
